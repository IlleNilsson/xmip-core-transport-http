[package]
name = "xmip-core-transport-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-http"
description = "HTTP transport: one request body is one Stream, with a reply channel. HTTP/2 or HTTP/1.1 per connection, agreed by ALPN over TLS or known beforehand (h2c) where configured; a Receive Location serves either. HTTPS behind the tls feature. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Transport trait, Arrived, Directions, the error
# vocabulary and the line-oriented wire helpers live there. Standard library
# otherwise, which is what lets this build on every target in
# deployment-model.md without a cross-compilation story. Its declaration
# takes the capability's `timeout` (`transport::configured::timeout`).
transport = { workspace = true }

# Optional, and only for `tls`: the estate's TLS, hybrid key exchange and
# all, which this crate carried until 2026-09-23 where no other transport
# could reach it.
tls = { workspace = true, optional = true }
# The URL a Location names (`net::Endpoint`) and HTTP/1.1 on the wire
# (`net::http`): the one codec this transport and every technology riding
# on it exchange a request for its answer with.
net = { workspace = true, optional = true }
# Percent-encoding, written and read once for the estate: the HTTP event
# binding's escaping among its users.
codec = { workspace = true, optional = true }
# The event capability's wire (ADR-0065 clause 3): the Wire this crate
# implements, the Carried it posts and the Rules its HTTP binding answers
# by — the two modes over them are written there, once, and the HTTP
# binding's prefix, matching and escaping here. Behind the default feature
# with the rest of the code, never a feature of its own, as TLS is: every
# node links it already, through the runtime, so a feature of its own would
# only hide the wire from `cargo test`. A Technology may depend on
# Foundation (repository-model.md section 4).
event = { workspace = true, optional = true }
# The names a request's method, target, query, headers and peer travel on
# its arrival under, which the identity gates read (`context::property`,
# ADR-0019 amendment 2026-09-24).
context = { workspace = true, optional = true }
# The Party a Wire carries to, by identifier, and the settings this
# technology declares (xcore::settings).
xcore = { workspace = true }

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false
required-features = ["test-support"]

[dev-dependencies]
# The test cluster's names, from its `cluster.xmip` (`configure::fixture`;
# ADR-0056, amendment 2026-10-03): no test writes a cluster or node name.
configure = { workspace = true, features = ["test-support"] }
# The policy the forwarding tests hand their hub, allowing their Party:
# the authorize capability's party technology. Being in the process admits
# nobody.
authorize-party = { workspace = true }
# The latency spread the tests hold, from the capability's test support
# and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# The hub the forwarding tests subscribe to, the forwarder they carry
# through and the subscriber they subscribe as, a proven caller the
# delivery's test fixture builds (`delivery::subscriber::fixture`): test
# support, as every crate's fixture is, and never a production build
# (ADR-0065, amendment 2026-11-13).
xcluster = { workspace = true, default-features = false, features = ["test-support"] }
# The processor time an Event's threads used, which the tests hold, and the
# Clock a test steps (`xcore::clock::Stepped`).
xcore = { workspace = true, features = ["test-support"] }
# The HTTP/2 peer that floods PINGs either side of a span, which one
# request off a connection is held to (`net::fixture::pinging`).
net = { workspace = true, features = ["test-support"] }
# The forwarding tests: a subscriber's audit, the stage an Event reports,
# and one real retry guard.
audit = { workspace = true }
# The sink that audit keeps its records in, read back from the file, and
# the test's own folder it writes in, removed once audit's keeper kept them
# (`audit_file::temporary`).
audit-file = { workspace = true, features = ["test-support"] }
node = { workspace = true }
# The guard the event-wire tests judge an attempt by (`resilience::Guard`);
# the library itself uses none of the capability (unused_dependencies).
resilience = { workspace = true }
retry = { workspace = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:codec", "dep:event", "dep:context"]
# The declaration alone.
declaration = []

# HTTPS. Off by default because it is the only thing here that reaches outside
# the standard library, and a forwarder on an edge device should not carry a TLS
# stack it never opens; the technology's code, so the default with it.
tls = ["default", "dep:tls", "transport/tls"]

# The far end this crate's tests and its timing program both stand up
# (`fixture::keeping`), written once and never in a production build
# (doc/governance/rust-style.md section 5c); the technology's code, so the
# default with it.
test-support = ["default"]

[lints]
workspace = true
