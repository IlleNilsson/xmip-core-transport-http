# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-http"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-http"
description = "HTTP transport: one request body is one Stream, with a reply channel. HTTP/2 or HTTP/1.1 per connection, agreed by ALPN over TLS or known beforehand (h2c) where configured; a Receive Location serves either. HTTPS behind the tls feature. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Transport trait, Arrived, Directions, the error
# vocabulary and the line-oriented wire helpers live there. Standard library
# otherwise, which is what lets this build on every target in
# deployment-model.md without a cross-compilation story.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }

# Optional, and only for `tls`: the estate's TLS, hybrid key exchange and
# all, which this crate carried until 2026-09-23 where no other transport
# could reach it.
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main", optional = true }
# The estate's encoding primitives: the civil calendar a date header is
# written from.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The URL a Location names (`net::Endpoint`) and HTTP/1.1 on the wire
# (`net::http`): the one codec this transport and every technology riding
# on it exchange a request for its answer with.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# The event capability's wire (ADR-0065 clause 3): the Wire this crate
# implements and the Carried it posts — the wire event's HTTP binding is
# written there, once. Not behind a feature, as TLS is: every node links
# it already, through the runtime, so a feature would only hide the wire
# from `cargo test`. A Technology may depend on Foundation
# (repository-model.md section 4).
event = { package = "xmip-core-event", git = "https://github.com/IlleNilsson/xmip-core-event", branch = "main" }
# The failure a Wire's attempt answers with, which the guards judge.
resilience = { package = "xmip-core-resilience", git = "https://github.com/IlleNilsson/xmip-core-resilience", branch = "main" }
# The Party a Wire carries to, by identifier.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
# The latency spread the tests hold, from the capability's test support
# and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }
# The forwarding tests: a subscriber's audit, the stage an Event reports,
# and one real retry guard.
audit = { package = "xmip-core-audit", git = "https://github.com/IlleNilsson/xmip-core-audit", branch = "main" }
node = { package = "xmip-core-node", git = "https://github.com/IlleNilsson/xmip-core-node", branch = "main" }
retry = { package = "xmip-core-resilience-retry", git = "https://github.com/IlleNilsson/xmip-core-resilience-retry", branch = "main" }

[features]
default = []

# HTTPS. Off by default because it is the only thing here that reaches outside
# the standard library, and a forwarder on an edge device should not carry a TLS
# stack it never opens.
tls = ["dep:tls", "transport/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

# What this depends on runs optimized in a debug build (rust-style.md 5b).
[profile.dev.package."*"]
opt-level = 3
