# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-http"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-http"
description = "HTTP transport: one request body is one Stream, with a reply channel; HTTPS behind the tls feature. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Transport trait, Arrived, Directions, the error
# vocabulary and the line-oriented wire helpers live there. Standard library
# otherwise, which is what lets this build on every target in
# deployment-model.md without a cross-compilation story.
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# XML character data, escaped as every reader in the estate unescapes it.
codec = { package = "xmip-core-codec", git = "https://github.com/IlleNilsson/xmip-core-codec", branch = "main" }

# The signatures the technologies riding on HTTP share through this crate
# (ADR-0044, 2026-09-14): Signature Version 4 is SHA-256 and HMAC-SHA256,
# a Shared Access Signature is HMAC-SHA256 written as base64. Pure Rust,
# small, and carried unconditionally: unlike TLS they are a few hundred
# lines, not a stack.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Optional, and only for `tls`: the estate's TLS, hybrid key exchange and
# all, which this crate carried until 2026-09-23 where no other transport
# could reach it.
tls = { package = "xmip-core-tls", git = "https://github.com/IlleNilsson/xmip-core-tls", branch = "main", optional = true }

[dev-dependencies]

[features]
default = []

# HTTPS. Off by default because it is the only thing here that reaches outside
# the standard library, and a forwarder on an edge device should not carry a TLS
# stack it never opens.
tls = ["dep:tls", "transport/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
